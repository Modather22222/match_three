name: flutter_game
description: "Match-Three Tile Puzzle Game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.22.0

  # Math
  vector_math: ^2.1.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod: ^2.6.1

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Backend
  supabase_flutter: ^2.6.0

  # Audio
  audioplayers: ^6.2.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/